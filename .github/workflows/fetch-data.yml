name: Fetch data

# Run by hand: Actions tab -> "Fetch data" -> "Run workflow".
# GitHub's servers can reach the World Bank API, so the data is downloaded here and committed to data/raw/.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Download World Bank data (WDI + WGI)
        run: python scripts/fetch_worldbank.py
      - name: Commit downloaded data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          git diff --cached --quiet || git commit -m "Fetch World Bank data ($(date -u +%Y-%m-%d))"
          git push
